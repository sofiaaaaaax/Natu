<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NATU · Sensor Sísmico Móvil</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e2e26 0%, #111a15 100%);
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding-top: 10px;
        }

        .badge-proyecto {
            display: inline-block;
            font-size: 0.75em;
            letter-spacing: 2px;
            font-weight: 700;
            color: #d4a574;
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid #d4a574;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.6em;
            color: #ffffff;
            font-weight: 700;
        }

        p.subtitulo {
            font-size: 0.85em;
            color: #a4a478;
            margin-top: 4px;
        }

        /* Estado de conexión */
        .status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 16px auto;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85em;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 280px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff5252;
            box-shadow: 0 0 8px #ff5252;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-pill.connected .dot {
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        /* Centro: Medidor de Voltaje */
        .meter-container {
            background: rgba(44, 62, 53, 0.45);
            border: 1.5px solid rgba(212, 165, 116, 0.35);
            border-radius: 20px;
            padding: 24px 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .meter-container.active-shake {
            border-color: #ff6b6b;
            box-shadow: 0 0 35px rgba(255, 107, 107, 0.35);
        }

        .meter-label {
            font-size: 0.78em;
            letter-spacing: 1.5px;
            color: #a4a478;
            text-transform: uppercase;
            font-weight: 600;
        }

        .voltage-display {
            font-size: 3.6em;
            font-weight: 800;
            color: #d4a574;
            margin: 8px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
            transition: color 0.15s;
        }

        .meter-container.active-shake .voltage-display {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.7);
        }

        .voltage-unit {
            font-size: 0.45em;
            color: #a4a478;
            margin-left: 2px;
        }

        /* Barra de progreso de voltaje */
        .bar-wrapper {
            background: rgba(0, 0, 0, 0.35);
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 14px 0 8px;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a4a478 0%, #d4a574 60%, #ff6b6b 100%);
            border-radius: 8px;
            transition: width 0.06s ease-out;
        }

        .umbral-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ff5252;
            box-shadow: 0 0 6px #ff5252;
            left: 50%; /* 2.5V de 5.0V por defecto */
        }

        .status-alerta {
            font-size: 0.88em;
            font-weight: 700;
            color: #a4a478;
            min-height: 22px;
            margin-top: 6px;
            transition: color 0.15s;
        }

        .meter-container.active-shake .status-alerta {
            color: #ff6b6b;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        /* Controles y Ajustes */
        .controls-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-row label {
            color: #cfd6cd;
            font-weight: 600;
        }

        .control-row span.val {
            color: #d4a574;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #d4a574;
            margin-top: 6px;
        }

        /* Botones de acción */
        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, background 0.2s;
            margin-bottom: 8px;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-permission {
            background: linear-gradient(135deg, #d4a574 0%, #b88654 100%);
            color: #1a251f;
        }

        .btn-simulate {
            background: rgba(164, 164, 120, 0.2);
            color: #d4a574;
            border: 1px dashed #d4a574;
        }

        .btn-simulate:active {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        footer {
            text-align: center;
            font-size: 0.72em;
            color: #7b8c82;
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <span class="badge-proyecto">Proyecto NATU · ABP</span>
        <h1>Sensor Sísmico</h1>
        <p class="subtitulo">Acelerómetro Móvil en Tiempo Real</p>
    </header>

    <div class="status-pill" id="status-pill">
        <span class="dot"></span>
        <span id="status-text">Conectando a Diapo 8...</span>
    </div>

    <main>
        <div class="meter-container" id="meter-container">
            <div class="meter-label">Señal Generada</div>
            <div class="voltage-display" id="voltage-display">0.00<span class="voltage-unit">V</span></div>
            
            <div class="bar-wrapper">
                <div class="bar-fill" id="bar-fill"></div>
                <div class="umbral-marker" id="umbral-marker" title="Umbral de Alarma"></div>
            </div>

            <div class="status-alerta" id="status-alerta">REPOSO (Movimiento leve)</div>
        </div>

        <div class="controls-card">
            <div class="control-row">
                <label for="sensibilidad">Sensibilidad del sensor:</label>
                <span class="val" id="sensibilidad-val">1.2x</span>
            </div>
            <input type="range" id="sensibilidad" min="0.4" max="3.0" step="0.1" value="1.2">
        </div>

        <button type="button" class="btn-action btn-permission" id="btn-permiso">
            ⚡ Habilitar Acelerómetro
        </button>

        <button type="button" class="btn-action btn-simulate" id="btn-sacudir">
            🖐️ Mantén presionado para simular sismo
        </button>
    </main>

    <footer>
        Conectado a Diapositiva 8 · Circuito de Alarma y Sismógrafo
    </footer>

    <script>
        (function() {
            'use strict';

            var ws = null;
            var conectado = false;
            var sensibilidad = 1.2;
            var ultimoEnvio = 0;
            var sensorActivo = false;
            var simInterval = null;
            var voltActual = 0;

            var statusPill = document.getElementById('status-pill');
            var statusText = document.getElementById('status-text');
            var voltageDisplay = document.getElementById('voltage-display');
            var barFill = document.getElementById('bar-fill');
            var meterContainer = document.getElementById('meter-container');
            var statusAlerta = document.getElementById('status-alerta');
            var sliderSens = document.getElementById('sensibilidad');
            var sensVal = document.getElementById('sensibilidad-val');
            var btnPermiso = document.getElementById('btn-permiso');
            var btnSacudir = document.getElementById('btn-sacudir');

            // --- Control de sensibilidad ---
            sliderSens.addEventListener('input', function() {
                sensibilidad = parseFloat(sliderSens.value) || 1.0;
                sensVal.textContent = sensibilidad.toFixed(1) + 'x';
            });

            // --- Conexión WebSocket ---
            function conectarWebSocket() {
                var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                var host = location.host || 'localhost:3000';
                var wsUrl = protocol + '//' + host;

                try {
                    ws = new WebSocket(wsUrl);

                    ws.onopen = function() {
                        conectado = true;
                        statusPill.classList.add('connected');
                        statusText.textContent = 'Enlazado a Diapositiva 8';
                    };

                    ws.onclose = function() {
                        conectado = false;
                        statusPill.classList.remove('connected');
                        statusText.textContent = 'Reconectando con Diapo 8...';
                        setTimeout(conectarWebSocket, 2000);
                    };

                    ws.onerror = function() {
                        conectado = false;
                        statusPill.classList.remove('connected');
                        statusText.textContent = 'Desconectado del servidor';
                    };
                } catch (e) {
                    setTimeout(conectarWebSocket, 3000);
                }
            }

            // --- Enviar voltaje y actualizar UI ---
            function procesarVoltaje(v) {
                // Limitar entre 0.0 y 5.0 V
                var clamped = Math.max(0, Math.min(5, v));
                voltActual = clamped;

                // Actualizar interfaz móvil
                voltageDisplay.innerHTML = clamped.toFixed(2) + '<span class="voltage-unit">V</span>';
                var pct = (clamped / 5.0) * 100;
                barFill.style.width = pct + '%';

                var enAlarma = clamped >= 2.5; // Referencia visual de 2.5V
                meterContainer.classList.toggle('active-shake', enAlarma);
                if (enAlarma) {
                    statusAlerta.textContent = '🚨 ¡ALARMA DISPARADA EN PANTALLA!';
                } else if (clamped > 0.4) {
                    statusAlerta.textContent = 'Vibración detectada (Bajo umbral)';
                } else {
                    statusAlerta.textContent = 'REPOSO (Sin movimiento)';
                }

                // Transmitir al servidor por WebSocket a máximo ~45 Hz para no saturar
                var ahora = performance.now();
                if (ahora - ultimoEnvio >= 22) {
                    ultimoEnvio = ahora;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            tipo: 'motion',
                            v: clamped,
                            t: Date.now()
                        }));
                    }
                }
            }

            // --- Captura de acelerómetro ---
            function procesarMovimiento(event) {
                var acc = event.acceleration;
                var x = 0, y = 0, z = 0;

                if (acc && (acc.x !== null || acc.y !== null || acc.z !== null)) {
                    x = acc.x || 0;
                    y = acc.y || 0;
                    z = acc.z || 0;
                } else if (event.accelerationIncludingGravity) {
                    // Si el navegador solo da aceleración con gravedad, filtramos el reposo (~9.8)
                    var gx = event.accelerationIncludingGravity.x || 0;
                    var gy = event.accelerationIncludingGravity.y || 0;
                    var gz = event.accelerationIncludingGravity.z || 0;
                    var magGrav = Math.sqrt(gx*gx + gy*gy + gz*gz);
                    var delta = Math.abs(magGrav - 9.806);
                    x = delta;
                    y = 0;
                    z = 0;
                }

                var magnitud = Math.sqrt(x*x + y*y + z*z);

                // Zona muerta para ruido leve en reposo (< 0.8 m/s²)
                if (magnitud < 0.8) {
                    procesarVoltaje(0);
                    return;
                }

                // Mapear magnitud (0.8 m/s² a 16 m/s²) a voltaje (0V a 5.0V) con la sensibilidad
                var volt = ((magnitud - 0.8) / 15.0) * 5.0 * sensibilidad;
                procesarVoltaje(volt);
            }

            // --- Solicitud de permisos (iOS 13+ y Chrome) ---
            function activarSensor() {
                if (typeof DeviceMotionEvent !== 'undefined') {
                    if (typeof DeviceMotionEvent.requestPermission === 'function') {
                        DeviceMotionEvent.requestPermission()
                            .then(function(permissionState) {
                                if (permissionState === 'granted') {
                                    window.addEventListener('devicemotion', procesarMovimiento);
                                    sensorActivo = true;
                                    btnPermiso.textContent = '✅ Acelerómetro Activo';
                                    btnPermiso.style.background = '#4caf50';
                                    btnPermiso.style.color = '#fff';
                                } else {
                                    alert('Permiso de movimiento denegado por el navegador.');
                                }
                            })
                            .catch(function(err) {
                                alert('Error al solicitar acelerómetro: ' + err);
                            });
                    } else {
                        // Android y navegadores estándar
                        window.addEventListener('devicemotion', procesarMovimiento);
                        sensorActivo = true;
                        btnPermiso.textContent = '✅ Acelerómetro Activo';
                        btnPermiso.style.background = '#4caf50';
                        btnPermiso.style.color = '#fff';
                    }
                } else {
                    alert('Tu navegador no soporta DeviceMotionEvent. Usa el botón táctil abajo.');
                }
            }

            btnPermiso.addEventListener('click', activarSensor);

            // Intentar auto-activar de inmediato
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
                window.addEventListener('devicemotion', procesarMovimiento);
                sensorActivo = true;
                btnPermiso.textContent = '✅ Acelerómetro Activo';
                btnPermiso.style.background = '#4caf50';
                btnPermiso.style.color = '#fff';
            }

            // --- Simulación táctil (Fallback) ---
            function iniciarSimulacion() {
                var fase = 0;
                simInterval = setInterval(function() {
                    fase += 0.3;
                    // Generar onda oscilante entre 3.0V y 4.8V para superar el umbral
                    var valSimulado = 3.5 + Math.sin(fase) * 1.3;
                    procesarVoltaje(valSimulado);
                }, 30);
            }

            function detenerSimulacion() {
                if (simInterval) clearInterval(simInterval);
                simInterval = null;
                // Desactivar instantáneamente a 0V
                procesarVoltaje(0);
            }

            btnSacudir.addEventListener('mousedown', iniciarSimulacion);
            btnSacudir.addEventListener('touchstart', function(e) {
                e.preventDefault();
                iniciarSimulacion();
            });

            window.addEventListener('mouseup', detenerSimulacion);
            window.addEventListener('touchend', detenerSimulacion);

            // Iniciar WebSocket
            conectarWebSocket();
        })();
    </script>
</body>
</html>

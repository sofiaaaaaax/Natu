<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Desastres Naturales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="styles/Sismos1.css">
    <link rel="stylesheet" href="styles/Navegacion.css">
    <style>
        .white-text {
            color: white !important;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <span class="logo-icon">🌿</span>
            <span class="logo-text">NATU</span>
        </div>

        <div class="header-actions" data-nav-autologout>
            <a href="Sismos.html" class="nav-btn">🏠 Inicio</a>
            <button type="button" class="nav-btn" data-nav="back">← Volver</button>
        </div>
    </header>

    <main class="hero-section registration-page">
        
        <div class="promo-text">
            <h1>Inicia sesion</h1>
            <h1>para</h1>
            <h1>descubrir</h1>
            <h1>este</h1>
            <h1>gran mundo</h1>
        </div>

        <div class="registration-form-panel">
            <div class="form-header">
                <h2 class="form-title">INICIAR SESION</h2>
            </div>
    
            <form id="loginForm" class="registration-form">
        
                <label for="username" class="white-text">Nombre De Usuario</label>
                <input type="text" id="username" name="username" required>
        
                <label for="password" class="white-text">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <p class="white-text" style="font-size:0.8em; opacity:0.85; margin-bottom:10px;">
                    Al iniciar sesión enviaremos un aviso al correo con el que te registraste.
                </p>
        
                <p class="forgot-password-link">
                    <a href="Olvida-Contraseña.html" class="white-text">¿Olvidaste tu contraseña?</a>
                </p>

                <nav class="user-actions">
                    <button type="submit" class="button is-black">Continuar</button>
                    <a href="Registro.html" class="button is-link">Registrarse</a> 
                </nav>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script/EmailConfig.js"></script>
    <script src="script/Navegacion.js"></script>
    <script src="script/Iniciar-Sesion.js"></script>
</body>
</html>
